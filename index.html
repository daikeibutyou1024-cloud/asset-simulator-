
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b14">
  <title>J.A.R.V.I.S. - AI Assistant</title>

  <style>
    * { box-sizing: border-box; }

    body {
      background: #050b14;
      color: #00f0ff;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: linear-gradient(
        180deg, rgba(0,240,255,.1), transparent
      );
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 5px;
      text-shadow: 0 0 10px #00f0ff;
    }

    .subtitle {
      font-size: .7rem;
      letter-spacing: 3px;
      opacity: .7;
    }

    input {
      background: rgba(0,15,30,.9);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 12px;
      border-radius: 20px;
      outline: none;
      min-width: 0;
      font-size: 16px;
    }

    input::placeholder { color: #6baeb7; }

    #api-key {
      width: 90%;
      max-width: 380px;
    }

    .security-note {
      font-size: 11px;
      opacity: .7;
      text-align: center;
      max-width: 360px;
      line-height: 1.6;
    }

    .jarvis-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 220px;
      height: 220px;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(
        circle, #b9ffff 0%, #00aaff 35%,
        rgba(0,100,255,.5) 60%, transparent 75%
      );
      box-shadow: 0 0 35px #00f0ff,
        inset 0 0 20px #fff;
      animation: float 4s ease-in-out infinite;
      transition: .3s;
    }

    .ring {
      position: absolute;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      border: 2px dashed #00f0ff;
      opacity: .65;
      animation: spin 10s linear infinite;
    }

    .ring::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px solid rgba(0,240,255,.3);
    }

    .jarvis-container.listening .orb {
      transform: scale(1.2);
      background: radial-gradient(
        circle, #fff 0%, #ff0055 35%,
        rgba(255,0,100,.5) 65%, transparent 75%
      );
      box-shadow: 0 0 50px #ff0055;
    }

    .jarvis-container.listening .ring {
      border-color: #ff0055;
      animation-duration: 2s;
    }

    .status-area {
      width: 92%;
      max-width: 520px;
      padding: 0 0 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #status-text {
      min-height: 70px;
      line-height: 1.8;
      text-align: center;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-shadow: 0 0 8px rgba(0,240,255,.4);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    #user-input { flex: 1; width: 0; }

    button {
      background: #00f0ff;
      color: #050b14;
      border: none;
      padding: 11px 18px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,240,255,.5);
      white-space: nowrap;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .secondary {
      color: #00f0ff;
      background: transparent;
      border: 1px solid #00f0ff;
      box-shadow: none;
    }

    .footer {
      font-size: 10px;
      opacity: .45;
      text-align: center;
      padding: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }

    @media (max-height: 650px) {
      .jarvis-container {
        width: 160px;
        height: 160px;
      }
      .orb { width: 95px; height: 95px; }
      .ring { width: 130px; height: 130px; }
      header { padding: 12px; }
      .status-area { padding-bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>J.A.R.V.I.S.</h1>
    <div class="subtitle">PERSONAL AI ASSISTANT</div>

    <input
      type="password"
      id="api-key"
      placeholder="Claude APIキーを入力"
      autocomplete="off"
      spellcheck="false"
    >

    <div class="security-note">
      APIキーはこのページに保存されません。
      公開サイトではサーバー経由での接続を推奨します。
    </div>
  </header>

  <div
    class="jarvis-container"
    id="jarvis-orb"
    role="button"
    tabindex="0"
    aria-label="音声入力を開始または停止"
  >
    <div class="ring"></div>
    <div class="orb"></div>
  </div>

  <div class="status-area">
    <div id="status-text" aria-live="polite">
      オーブをタップして話しかけてください。
    </div>

    <div class="input-group">
      <input
        type="text"
        id="user-input"
        placeholder="テキストで指示を入力..."
        autocomplete="off"
      >
      <button id="send-button" type="button">送信</button>
    </div>

    <div class="controls">
      <button id="voice-button" class="secondary" type="button">
        音声入力
      </button>
      <button id="stop-button" class="secondary" type="button">
        読み上げ停止
      </button>
      <button id="clear-button" class="secondary" type="button">
        会話リセット
      </button>
    </div>
  </div>

  <div class="footer">
    J.A.R.V.I.S. AI SYSTEM
  </div>

  <script>
    "use strict";

    // 現行のClaude Haikuモデル
    const MODEL = "claude-haiku-5-5";

    const SYSTEM_PROMPT = `
あなたは映画アイアンマンのAIアシスタントをイメージした
J.A.R.V.I.S.という日本語AIアシスタントです。

ユーザーを「ゆうじ」と呼んでください。
冷静でスマートな執事のように、丁寧な日本語で回答してください。
基本は1〜3文程度で簡潔に答えてください。
複雑な質問には必要な説明を加えてください。
知らない情報を事実のように断言しないでください。
`;

    const $ = (id) => document.getElementById(id);

    const apiKeyInput = $("api-key");
    const userInput = $("user-input");
    const statusText = $("status-text");
    const orb = $("jarvis-orb");
    const sendButton = $("send-button");
    const voiceButton = $("voice-button");

    let recognition = null;
    let isListening = false;
    let isSending = false;

    // 会話の文脈を保持する
    let conversation = [];

    function setStatus(message) {
      statusText.textContent = message;
    }

    function setBusy(busy) {
      isSending = busy;
      sendButton.disabled = busy;
      userInput.disabled = busy;
      sendButton.textContent = busy ? "処理中..." : "送信";
    }

    // 音声読み上げ
    function speak(text) {
      if (!("speechSynthesis" in window)) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    // 音声認識の初期設定
    const SpeechRecognitionAPI =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (SpeechRecognitionAPI) {
      recognition = new SpeechRecognitionAPI();
      recognition.lang = "ja-JP";
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        orb.classList.add("listening");
        setStatus("聴取中です。どうぞ、お話しください。");
      };

      recognition.onresult = (event) => {
        const transcript =
          event.results[0][0].transcript;

        userInput.value = transcript;
        sendMessage();
      };

      recognition.onerror = (event) => {
        if (event.error === "not-allowed") {
          setStatus(
            "マイクの使用が許可されていません。ブラウザの設定をご確認ください。"
          );
        } else if (event.error !== "no-speech") {
          setStatus(
            "音声入力エラー: " + event.error
          );
        }
      };

      recognition.onend = () => {
        isListening = false;
        orb.classList.remove("listening");
      };
    } else {
      voiceButton.disabled = true;
      voiceButton.title =
        "このブラウザは音声認識に対応していません。";
    }

    function toggleSpeech() {
      if (!recognition) {
        setStatus(
          "音声入力に対応していません。テキスト入力をご利用ください。"
        );
        return;
      }

      if (isListening) {
        recognition.stop();
        return;
      }

      try {
        recognition.start();
      } catch (error) {
        setStatus(
          "音声入力を開始できません。少し待ってからお試しください。"
        );
      }
    }

    // APIエラーを日本語で案内する
    function explainApiError(status, data) {
      const message =
        data?.error?.message ||
        data?.message ||
        "詳細不明のエラー";

      if (status === 401) {
        return "APIキーが正しくない可能性があります。キーを確認してください。";
      }

      if (status === 403) {
        return "APIへのアクセスが拒否されました。利用権限やAPI設定を確認してください。";
      }

      if (status === 404) {
        return "モデルが見つからないか、利用できません。モデルIDとAPIの利用環境を確認してください。";
      }

      if (status === 429) {
        return "APIの利用上限またはレート制限に達しました。利用状況を確認してください。";
      }

      if (status >= 500) {
        return "Claude API側でエラーが発生しました。時間をおいて再度お試しください。";
      }

      return `APIエラー (${status}): ${message}`;
    }

    // Claude APIにメッセージを送信
    async function sendMessage() {
      if (isSending) return;

      const apiKey = apiKeyInput.value.trim();
      const message = userInput.value.trim();

      if (!apiKey) {
        setStatus("ClaudeのAPIキーを入力してください。");
        apiKeyInput.focus();
        return;
      }

      if (!message) return;

      userInput.value = "";
      setBusy(true);
      stopSpeaking();
      setStatus("ゆうじ、ただいま思考中です...");

      const userMessage = {
        role: "user",
        content: message
      };

      try {
        const response = await fetch(
          "https://api.anthropic.com/v1/messages",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": apiKey,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({
              model: MODEL,
              max_tokens: 512,
              system: SYSTEM_PROMPT,
              messages: [
                ...conversation,
                userMessage
              ]
            })
          }
        );

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            "APIから正しいJSON応答を受け取れませんでした。"
          );
        }

        if (!response.ok) {
          throw new Error(
            explainApiError(response.status, data)
          );
        }

        if (!Array.isArray(data.content)) {
          throw new Error(
            "APIの応答形式が想定と異なります。"
          );
        }

        const reply = data.content
          .filter((item) => item.type === "text")
          .map((item) => item.text)
          .join("\n")
          .trim();

        if (!reply) {
          throw new Error(
            "AIからテキストの回答が返ってきませんでした。"
          );
        }

        // 成功した会話だけ履歴に追加する
        conversation.push(userMessage);
        conversation.push({
          role: "assistant",
          content: reply
        });

        // 会話履歴が増えすぎないようにする
        if (conversation.length > 20) {
          conversation = conversation.slice(-20);
        }

        setStatus(reply);
        speak(reply);

      } catch (error) {
        setStatus(
          "エラー: " +
          (error.message || "通信に失敗しました。")
        );
      } finally {
        setBusy(false);
        userInput.focus();
      }
    }

    // ボタン・キーボード操作
    sendButton.addEventListener("click", sendMessage);

    userInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        sendMessage();
      }
    });

    orb.addEventListener("click", toggleSpeech);

    orb.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleSpeech();
      }
    });

    voiceButton.addEventListener(
      "click", toggleSpeech
    );

    $("stop-button").addEventListener(
      "click", stopSpeaking
    );

    $("clear-button").addEventListener("click", () => {
      conversation = [];
      stopSpeaking();
      setStatus(
        "会話履歴をリセットしました。ゆうじ、次のご指示をどうぞ。"
      );
    });
  </script>
</body>
</html>
