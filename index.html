<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #050b14;
      color: #00f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }
    
    header {
      width: 100%;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: linear-gradient(180deg, rgba(0,240,255,0.1) 0%, rgba(0,0,0,0) 100%);
    }
    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 4px;
      text-shadow: 0 0 10px #00f0ff;
    }
    input[type="password"], input[type="text"] {
      background: rgba(0, 15, 30, 0.8);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 8px 12px;
      border-radius: 20px;
      outline: none;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,240,255,0.2);
    }
    #api-key { width: 80%; max-width: 320px; font-size: 0.8rem; }

    .jarvis-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 200px;
      height: 200px;
      cursor: pointer;
    }
    .orb {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f0ff 0%, rgba(0,100,255,0.8) 50%, rgba(0,0,0,0) 70%);
      box-shadow: 0 0 30px #00f0ff, inset 0 0 20px #fff;
      transition: all 0.3s ease;
      animation: float 4s ease-in-out infinite;
    }
    .ring {
      position: absolute;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 2px dashed #00f0ff;
      opacity: 0.5;
      animation: spin 10s linear infinite;
    }
    .jarvis-container.listening .orb {
      transform: scale(1.3);
      background: radial-gradient(circle, #ff0055 0%, rgba(255,0,100,0.8) 50%, rgba(0,0,0,0) 70%);
      box-shadow: 0 0 50px #ff0055, inset 0 0 30px #fff;
    }
    .jarvis-container.listening .ring {
      border-color: #ff0055;
      animation: spin 2s linear infinite;
    }

    .status-area {
      width: 90%;
      max-width: 500px;
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    #status-text {
      font-size: 1.1rem;
      line-height: 1.6;
      min-height: 60px;
      text-shadow: 0 0 8px rgba(0,240,255,0.8);
      word-wrap: break-word;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    #user-input {
      flex: 1;
      text-align: left;
    }
    button {
      background: #00f0ff;
      color: #050b14;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px #00f0ff;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <header>
    <h1>J.A.R.V.I.S.</h1>
    <input type="password" id="api-key" placeholder="Gemini APIキーを入力">
  </header>

  <div class="jarvis-container" id="jarvis-orb" onclick="toggleSpeech()">
    <div class="ring"></div>
    <div class="orb"></div>
  </div>

  <div class="status-area">
    <div id="status-text">オーブをタップして話しかけてください、ゆうじ。</div>
    <div class="input-group">
      <input type="text" id="user-input" placeholder="テキストで指示を入力..." onkeypress="handleKey(event)">
      <button onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script>
    let recognition;
    let isListening = false;

    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('user-input').value = transcript;
        sendMessage();
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('jarvis-orb').classList.remove('listening');
      };
    }

    function toggleSpeech() {
      if (!recognition) return alert("お使いのブラウザは音声入力に対応していません。");
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
        isListening = true;
        document.getElementById('jarvis-orb').classList.add('listening');
        document.getElementById('status-text').innerText = "聴取中...";
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        window.speechSynthesis.speak(uttr);
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const keyInput = document.getElementById('api-key').value.trim();
      const userInput = document.getElementById('user-input').value.trim();
      if (!keyInput) return alert('Gemini APIキーを入力してください');
      if (!userInput) return;

      document.getElementById('status-text').innerText = "思考中...";
      document.getElementById('user-input').value = '';

      const systemPrompt = "あなたは映画アイアンマンのAIアシスタント『J.A.R.V.I.S.』です。ユーザーを『ゆうじ』と呼び、冷静かつスマート、最高峰の執事として1〜2文程度で簡潔に応答してください。";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${keyInput}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemPrompt}\n\nユーザー: ${userInput}` }] }]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        document.getElementById('status-text').innerText = reply;
        speak(reply);

      } catch (err) {
        document.getElementById('status-text').innerText = `エラー: ${err.message}`;
      }
    }
  </script>
</body>
</html>
