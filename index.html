
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b14">
<title>J.A.R.V.I.S. - Personal AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#050b14;color:#00f0ff;
 font-family:system-ui,-apple-system,sans-serif;
 display:flex;flex-direction:column;align-items:center;
}
header{
 width:100%;padding:22px 16px;text-align:center;
 background:linear-gradient(180deg,#06243a,transparent);
}
h1{font-size:26px;letter-spacing:5px;margin:0;text-shadow:0 0 12px #00f0ff}
.subtitle{font-size:10px;letter-spacing:3px;margin:8px 0 18px;opacity:.7}
input,textarea{
 width:100%;min-width:0;padding:13px;border-radius:12px;
 border:1px solid #087c94;background:#071522;color:#d8fcff;
 font:inherit;outline:none;
}
input:focus,textarea:focus{border-color:#00f0ff}
#api-key{max-width:420px}
.note{font-size:11px;line-height:1.6;opacity:.7;max-width:420px;margin:8px auto}
.orb-area{height:220px;width:220px;display:grid;place-items:center;position:relative;margin:12px auto}
.orb{
 width:115px;height:115px;border-radius:50%;
 background:radial-gradient(circle,#dfffff,#00aaff 35%,#0752a4 60%,transparent 75%);
 box-shadow:0 0 35px #00dfff,inset 0 0 18px white;
 animation:float 4s ease-in-out infinite;
}
.ring{position:absolute;width:165px;height:165px;border:2px dashed #00f0ff;border-radius:50%;animation:spin 12s linear infinite}
.orb-area.listening .orb{background:radial-gradient(circle,#fff,#ff0055 40%,transparent 75%);box-shadow:0 0 45px #ff0055}
.orb-area.listening .ring{border-color:#ff0055}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-8px)}}
main{width:92%;max-width:600px;padding-bottom:24px}
#status{
 min-height:90px;padding:14px;line-height:1.8;white-space:pre-wrap;
 overflow-wrap:anywhere;border:1px solid #123b4b;border-radius:14px;
 background:#071522;margin-bottom:14px;
}
label{display:block;font-size:12px;margin:12px 0 6px;opacity:.85}
.row{display:flex;gap:8px}
.row input{flex:1}
button{
 border:0;border-radius:12px;padding:12px 16px;font-weight:700;
 background:#00eaff;color:#03101a;cursor:pointer;
}
button.secondary{background:transparent;color:#00eaff;border:1px solid #087c94}
button:disabled{opacity:.5}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.small{font-size:11px;opacity:.65;line-height:1.6}
footer{padding:16px;font-size:10px;opacity:.4;text-align:center}
@media(max-width:420px){
 .row{gap:6px}
 button{padding:11px 12px}
 .orb-area{height:190px;width:190px}
 .ring{width:150px;height:150px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
 <h1>J.A.R.V.I.S.</h1>
 <div class="subtitle">PERSONAL AI ASSISTANT</div>
 <label for="api-key">Claude APIキー（利用時に入力）</label>
 <input id="api-key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
 <p class="note">キーはこのページのコードには保存しません。共有端末では使用せず、利用後は入力欄を消してください。API利用料が発生します。</p>
</header>

<div class="orb-area" id="orb" aria-label="音声入力">
 <div class="ring"></div><div class="orb"></div>
</div>

<main>
 <div id="status" role="status" aria-live="polite">準備完了です。ご指示をどうぞ。</div>

 <label for="user-input">メッセージ</label>
 <div class="row">
  <input id="user-input" placeholder="J.A.R.V.I.S.に話しかける..." autocomplete="off">
  <button id="send">送信</button>
 </div>

 <div class="controls">
  <button class="secondary" id="voice">🎙 音声入力</button>
  <button class="secondary" id="stop">読み上げ停止</button>
  <button class="secondary" id="reset">会話リセット</button>
  <button class="secondary" id="clear-key">キーを消す</button>
 </div>
 <p class="small">音声入力はブラウザーによって利用できない場合があります。APIキーをこのページのソースコードやGitHubに書き込まないでください。</p>
</main>
<footer>J.A.R.V.I.S. · PERSONAL AI SYSTEM</footer>

<script>
"use strict";

const MODEL = "claude-sonnet-4-6";
const SYSTEM_PROMPT = `
あなたはJ.A.R.V.I.S.という日本語AIアシスタントです。
冷静でスマートな執事のように、丁寧でわかりやすく回答してください。
ユーザーの希望を尊重し、初心者には操作を一つずつ案内してください。
不確かな情報を事実として断言せず、できないことは明確に説明してください。
`;

const $ = id => document.getElementById(id);
const keyInput = $("api-key");
const input = $("user-input");
const status = $("status");
const orb = $("orb");
const sendButton = $("send");
let conversation = [];
let busy = false;
let recognition = null;
let listening = false;

function show(text) {
 status.textContent = text;
}

function speak(text) {
 if (!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const u = new SpeechSynthesisUtterance(text);
 u.lang = "ja-JP";
 speechSynthesis.speak(u);
}

function stopSpeaking() {
 if ("speechSynthesis" in window) speechSynthesis.cancel();
}

async function sendMessage() {
 if (busy) return;
 const key = keyInput.value.trim();
 const message = input.value.trim();

 if (!key) {
  show("先にClaude APIキーを入力してください。");
  keyInput.focus();
  return;
 }
 if (!message) return;

 busy = true;
 sendButton.disabled = true;
 input.disabled = true;
 sendButton.textContent = "処理中...";
 input.value = "";
 stopSpeaking();
 show("思考中です...");

 const userMessage = {role:"user", content:message};

 try {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
   method:"POST",
   headers:{
    "content-type":"application/json",
    "x-api-key":key,
    "anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"
   },
   body:JSON.stringify({
    model:MODEL,
    max_tokens:1200,
    system:SYSTEM_PROMPT,
    messages:[...conversation,userMessage]
   })
  });

  const data = await response.json();

  if (!response.ok) {
   const message = data?.error?.message || "詳細不明のエラー";
   if (response.status === 401) throw new Error("APIキーが正しいか確認してください。");
   if (response.status === 403) throw new Error("APIの利用権限を確認してください。");
   if (response.status === 404) throw new Error("モデルが利用できないようです。モデルIDを確認してください。");
   if (response.status === 429) throw new Error("APIの利用上限またはレート制限に達しました。");
   throw new Error("APIエラー (" + response.status + "): " + message);
  }

  const reply = (data.content || [])
   .filter(item => item.type === "text")
   .map(item => item.text)
   .join("\n").trim();

  if (!reply) throw new Error("AIから回答が返りませんでした。");

  conversation.push(userMessage, {role:"assistant",content:reply});
  if (conversation.length > 20) conversation = conversation.slice(-20);

  show(reply);
  speak(reply);

 } catch (error) {
  show("エラー: " + (error.message || "通信に失敗しました。"));
 } finally {
  busy = false;
  sendButton.disabled = false;
  input.disabled = false;
  sendButton.textContent = "送信";
  input.focus();
 }
}

sendButton.addEventListener("click", sendMessage);
input.addEventListener("keydown", e => {
 if (e.key === "Enter" && !e.isComposing) {
  e.preventDefault();
  sendMessage();
 }
});

$("stop").addEventListener("click", stopSpeaking);
$("reset").addEventListener("click", () => {
 conversation = [];
 stopSpeaking();
 show("会話履歴をリセットしました。");
});
$("clear-key").addEventListener("click", () => {
 keyInput.value = "";
 show("APIキー入力欄を消去しました。");
});

const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechAPI) {
 recognition = new SpeechAPI();
 recognition.lang = "ja-JP";
 recognition.interimResults = false;
 recognition.continuous = false;

 recognition.onstart = () => {
  listening = true;
  orb.classList.add("listening");
  show("聴取中です。どうぞお話しください。");
 };
 recognition.onresult = e => {
  input.value = e.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror = e => {
  if (e.error !== "no-speech") show("音声入力エラー: " + e.error);
 };
 recognition.onend = () => {
  listening = false;
  orb.classList.remove("listening");
 };
}

function startVoice() {
 if (!recognition) {
  show("このブラウザーは音声入力に対応していません。テキスト入力をご利用ください。");
  return;
 }
 if (listening) recognition.stop();
 else {
  try { recognition.start(); }
  catch { show("音声入力を開始できません。少し待って再度お試しください。"); }
 }
}

$("voice").addEventListener("click", startVoice);
orb.addEventListener("click", startVoice);
orb.setAttribute("role","button");
orb.setAttribute("tabindex","0");
orb.addEventListener("keydown", e => {
 if (e.key === "Enter" || e.key === " ") {
  e.preventDefault();
  startVoice();
 }
});
</script>
</body>
</html>
